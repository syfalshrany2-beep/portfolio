<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة الدكتورة أمنية أبو السعود</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;font-family:Arial,Tahoma,sans-serif}
body{margin:0;min-height:100vh;background:linear-gradient(135deg,#fff5f8,#f7f0ff);color:#333}
.container{width:92%;max-width:700px;margin:auto;padding:30px 0}
.header{text-align:center;padding:20px}
.header h1{color:#7b3156;margin-bottom:10px}
.header p{color:#777}
.profile{width:130px;height:130px;border-radius:50%;margin:10px auto 20px;display:block;object-fit:cover;background:#ead5df;border:5px solid white;box-shadow:0 5px 20px #0002}
.buttons{display:flex;flex-direction:column;gap:12px;margin-top:20px}
.btn{border:0;border-radius:14px;padding:15px;font-size:17px;cursor:pointer;color:white;transition:.2s}
.btn:hover{transform:translateY(-2px);opacity:.92}
.facebook{background:#1877f2}.channel{background:#25a8e0}.login{background:#8d4770}.developer{background:#333}
.back{background:#777;margin-top:15px;width:100%}
.page{display:none}.page.active{display:block}
.box{background:white;border-radius:20px;padding:25px;box-shadow:0 8px 30px #0001;margin-top:20px}
.box h2{text-align:center;color:#7b3156}
.input{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;margin:7px 0;font-size:16px;outline:none}
.input:focus{border-color:#8d4770}
.error{display:none;background:#ffe2e2;color:#b00020;padding:10px;border-radius:10px;margin:10px 0;text-align:center}
.success{display:none;background:#e1f8e8;color:#16743a;padding:10px;border-radius:10px;margin:10px 0;text-align:center}
.dev-section{background:#fff;border-radius:18px;padding:20px;margin:15px 0;box-shadow:0 4px 15px #0001}
.dev-section h3{color:#7b3156;margin-top:0}
.card{background:#faf7f9;border-radius:15px;padding:15px;margin:12px 0;border-right:5px solid #8d4770}
.card h3{margin-top:0;color:#7b3156}
.small-btn{border:0;border-radius:9px;padding:9px 13px;margin:4px;cursor:pointer;color:white}
.delete{background:#c0392b}.empty{color:#888;text-align:center;padding:10px}
.grade-row{background:#f8f3f6;padding:12px;border-radius:12px;margin:8px 0}
.status{font-size:14px;color:#777;text-align:center;margin-top:10px}
hr{border:0;border-top:1px solid #eee;margin:20px 0}
.exam-option{display:block;background:#fff;border:1px solid #ddd;border-radius:12px;padding:13px;margin:8px 0;cursor:pointer}
.exam-option:hover{background:#f8f3f6}
.exam-question{background:#faf7f9;border-radius:15px;padding:15px;margin:15px 0}
.timer{font-size:25px;font-weight:bold;text-align:center;background:#fff0f0;color:#b00020;padding:12px;border-radius:12px;margin:15px 0}
.exam-status{display:inline-block;padding:6px 10px;border-radius:8px;background:#eee;font-size:13px}
</style>
</head>

<body>
<div class="container">

<!-- الرئيسية -->
<div id="home" class="page active">
<div class="header">
<img class="profile" src="logo.png" alt="شعار منصة الدكتورة أمنية">
<h1>منصة الدكتورة أمنية أبو السعود</h1>
<p>مادة الفلسفة — الصف الأول الثانوي</p>
</div>

<div class="buttons">
<button class="btn facebook" onclick="window.open('https://www.facebook.com/share/1EDciB8TL3/','_blank')">📘 Facebook</button>
<button class="btn channel" onclick="window.open('https://whatsapp.com/channel/0029VbDAG616BIEmAcp9sg2O','_blank')">💬 قناة WhatsApp</button>
<button class="btn login" onclick="showPage('studentLogin')">🎓 تسجيل دخول الطلاب</button>
<button class="btn developer" onclick="showDeveloperLogin()">🛠️ قسم المطور</button>
</div>
</div>

<!-- تسجيل الطالب -->
<div id="studentLogin" class="page">
<div class="box">
<h2>🎓 تسجيل دخول الطالب</h2>
<input id="studentName" class="input" type="text" placeholder="اسم الطالب">
<input id="studentCode" class="input" type="text" placeholder="الكود الخاص بالطالب">
<div id="studentError" class="error">❌ الاسم أو الكود غير صحيح</div>
<button class="btn login" onclick="studentLogin()">🔓 دخول</button>
<button class="btn back" onclick="goHome()">↩️ العودة للرئيسية</button>
<div id="studentStatus" class="status"></div>
</div>
</div>

<!-- لوحة الطالب -->
<div id="studentPanel" class="page">
<div class="box">
<h2>🎓 أهلاً يا <span id="studentWelcome"></span></h2>
<p style="text-align:center;color:#777;">دي صفحتك الخاصة على منصة الدكتورة أمنية ❤️</p>

<div class="buttons">
<button class="btn login" onclick="showLessons()">📚 الدروس</button>
<button class="btn channel" onclick="showHomework()">📝 الواجبات</button>
<button class="btn facebook" onclick="showGrades()">📊 الدرجات</button>
<button class="btn developer" onclick="showAnnouncements()">📢 الإعلانات</button>
<button class="btn login" onclick="showStudentExams()">🧠 الامتحان على المحاضرة</button>
</div>

<button class="btn back" onclick="goHome()">🚪 تسجيل الخروج</button>
</div>
</div>

<!-- امتحانات الطالب -->
<div id="studentExamsPanel" class="page">
<div class="box">
<h2>🧠 الامتحان على المحاضرة</h2>
<div id="studentExamsList">⏳ جاري تحميل الامتحانات...</div>
<button class="btn back" onclick="showPage('studentPanel')">↩️ العودة</button>
</div>
</div>

<!-- شاشة الامتحان -->
<div id="takeExamPanel" class="page">
<div class="box">
<h2 id="examTitle">الامتحان</h2>
<div id="examTimer" class="timer">⏱️ 00:00</div>
<div id="examQuestionsList"></div>
<button id="submitExamBtn" class="btn login" style="width:100%;margin-top:15px" onclick="submitCurrentExam()">✅ تسليم الامتحان</button>
<div id="examResultBox" class="success"></div>
</div>
</div>

<!-- الدروس -->
<div id="lessonsPanel" class="page">
<div class="box">
<h2>📚 الدروس</h2>
<div id="lessonsList">⏳ جاري تحميل الدروس...</div>
<button class="btn back" onclick="showPage('studentPanel')">↩️ العودة</button>
</div>
</div>

<!-- الدرجات -->
<div id="gradesPanel" class="page">
<div class="box">
<h2>📊 درجاتي</h2>
<div id="gradesList"></div>
<button class="btn back" onclick="showPage('studentPanel')">↩️
